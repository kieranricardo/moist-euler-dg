[build-system]
requires = [
    "meson-python>=0.16.0",
    "meson>=1.3.0",
    "ninja",
    "numpy>=1.26",
]
build-backend = "mesonpy"

[project]
name = "moist_euler_dg"
version = "1.0"
description = "Moist Euler equations DG solver."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Kieran Ricardo" },
]
dependencies = [
    "numpy>=1.26",
    "matplotlib",
]
